<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ALERTARA Emergency Response System</title>
  <desc id="description">Branded social sharing image for the ALERTARA Emergency Response System.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c2e"/>
      <stop offset="0.56" stop-color="#0b3b52"/>
      <stop offset="1" stop-color="#126f75"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d6c8"/>
      <stop offset="1" stop-color="#a6f0d7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#52d4cb" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#52d4cb" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020c16" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1060" cy="80" r="320" fill="url(#glow)"/>
  <circle cx="1060" cy="80" r="166" fill="none" stroke="#7ce2d3" stroke-opacity="0.17" stroke-width="2"/>
  <circle cx="1060" cy="80" r="106" fill="none" stroke="#7ce2d3" stroke-opacity="0.21" stroke-width="2"/>
  <path d="M850 0h350v216L1024 390 850 278z" fill="#0d5762" fill-opacity="0.3"/>
  <path d="M918 0h282v152l-141 126-141-81z" fill="#68d6ca" fill-opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="58" y="50" width="294" height="164" rx="30" fill="#ffffff" fill-opacity="0.97"/>
    <image href="logo.svg" x="77" y="57" width="256" height="146" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="394" y="94" fill="#91e7da" font-size="22" font-weight="700" letter-spacing="4">CONNECTED EMERGENCY OPERATIONS</text>
    <text x="394" y="164" fill="#ffffff" font-size="54" font-weight="800">ALERTARA</text>
    <text x="394" y="220" fill="#ffffff" font-size="44" font-weight="700">Emergency Response System</text>

    <rect x="58" y="266" width="1084" height="2" rx="1" fill="url(#accent)" opacity="0.62"/>

    <text x="58" y="331" fill="#ffffff" font-size="31" font-weight="700">Clearer coordination when every second matters.</text>
    <text x="58" y="376" fill="#d7e9ed" font-size="23">Incident intake, dispatch operations, responder monitoring,</text>
    <text x="58" y="410" fill="#d7e9ed" font-size="23">resource readiness, and inter-agency collaboration in one platform.</text>

    <g transform="translate(58 468)">
      <rect width="294" height="70" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#a6f0d7" stroke-opacity="0.3"/>
      <circle cx="38" cy="35" r="16" fill="#57d3c6"/>
      <path d="M31 35h14M38 28v14" stroke="#062132" stroke-width="4" stroke-linecap="round"/>
      <text x="68" y="43" fill="#ffffff" font-size="20" font-weight="700">Incident Intake</text>
    </g>
    <g transform="translate(372 468)">
      <rect width="324" height="70" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#a6f0d7" stroke-opacity="0.3"/>
      <circle cx="38" cy="35" r="16" fill="#57d3c6"/>
      <path d="M29 40l9-18 9 18M33 34h10" fill="none" stroke="#062132" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="43" fill="#ffffff" font-size="20" font-weight="700">Dispatch Coordination</text>
    </g>
    <g transform="translate(716 468)">
      <rect width="426" height="70" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#a6f0d7" stroke-opacity="0.3"/>
      <circle cx="38" cy="35" r="16" fill="#57d3c6"/>
      <path d="M30 35h16M38 27v16M33 30l10 10M43 30L33 40" stroke="#062132" stroke-width="2.8" stroke-linecap="round"/>
      <text x="68" y="43" fill="#ffffff" font-size="20" font-weight="700">Responder &amp; Agency Operations</text>
    </g>

    <text x="58" y="590" fill="#a9cbd1" font-size="20">emergency-response.alertaraqc.com</text>
    <text x="1142" y="590" fill="#a9cbd1" font-size="18" text-anchor="end">Quezon City</text>
  </g>
</svg>
